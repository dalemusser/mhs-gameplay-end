<body>
<!-- THE CURRENT SHOW, standalone. The whole page is built by the embed
     (lib/embed.js — docs/embed-api.md); this file only chooses the scores:
       ?profile=<name>  → a sample student from test-profiles/ (index.html lists them)
       no parameter     → no scores: every section plays its B variant, dark stars
       ?dev=1           → the beat selector (jump anywhere)
     The production host page (stratahub, /missionhydrosci/ceremony) mounts the
     same embed with scoresUrl + returnUrl instead. -->
<script src="lib/embed.js?v=1"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  MHSCeremony.mount(document.body, {
    profile: q.get('profile') || undefined,
    dev: q.has('dev'),
    onEvent: function (name, detail) { console.log('ceremony:' + name, detail); },
  });
})();
</script>
</body>
