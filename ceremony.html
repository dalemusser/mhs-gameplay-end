<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mission HydroSci — Final Ceremony</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #dfe6f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* speech bubble at the top, like the game */
  #bubble { position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    width: min(880px, 92vw); background: rgba(10,18,30,0.72); border: 1px solid rgba(90,160,255,0.45);
    border-radius: 14px; padding: 14px 20px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 0 24px rgba(40,120,220,0.25), inset 0 0 20px rgba(40,120,220,0.08);
    opacity: 0; transition: opacity .35s; pointer-events: none; }
  #bubble.show { opacity: 1; }
  #speakerName { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: #7fd0ff; margin-bottom: 6px; text-shadow: 0 0 10px rgba(80,180,255,0.6); }
  #bubbleText { font-size: 19px; line-height: 1.5; color: #b9c6da; }
  #bubbleText .w { transition: color .12s, text-shadow .12s; }
  #bubbleText .w.spoken { color: #ffffff; text-shadow: 0 0 12px rgba(120,200,255,0.8); }

  #controls { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; }
  button.ctl { background: rgba(20,40,70,0.8); color: #dfe6f0; border: 1px solid #3d6fa0;
    border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: background .12s; }
  button.ctl:hover { background: rgba(40,72,116,0.95); border-color: #5b9bff; }
  button.ctl.primary { background: #2b6fb8; border-color: #5b9bff; font-weight: 600; }
  button.ctl.primary:hover { background: #357fce; }
  #hint { position: fixed; top: 10px; left: 12px; font-size: 11px; color: #46566e; }
  /* start gate — a user gesture is required before browsers allow audio */
  #startOverlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,7,12,0.72); backdrop-filter: blur(5px); z-index: 50; transition: opacity .45s; }
  #startOverlay.hide { opacity: 0; pointer-events: none; }
  #startBtn { background: #2b6fb8; color: #fff; border: 1px solid #5b9bff; border-radius: 12px;
    padding: 15px 34px; font-size: 20px; font-weight: 600; cursor: pointer; box-shadow: 0 0 32px rgba(40,120,220,0.4); }
  #startBtn:hover:enabled { background: #357fce; }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="bubble">
  <div id="speakerName"></div>
  <div id="bubbleText"></div>
</div>

<div id="controls">
  <button class="ctl" id="replayBtn" title="Replay this line">↻ Replay</button>
  <button class="ctl primary" id="nextBtn">Next ▶</button>
</div>
<div id="hint">F = free camera · R = restart</div>
<div id="startOverlay"><button id="startBtn" disabled>Loading…</button></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="lib/aliveface.js?v=5"></script>
<script src="lib/gaze.js?v=5"></script>
<script src="lib/headlook.js?v=5"></script>
<script src="lib/resolver.js?v=1"></script>
<script src="lib/player.js?v=1"></script>
<script src="ceremony-definition.js?v=1"></script>
<script>
// Boot: pick the EA-score source, resolve the definition into a linear script, and
// hand it to the player.
//   ?profile=<name>  → test-harness mode (Phase 2): fetch test-profiles/<name>.json
//   no param         → production mode (Phase 5): /missionhydrosci/api/ea-scores;
//                      until that endpoint exists, empty scores — every conditional
//                      section resolves to its fallback (`otherwise`) variant.
(async () => {
  let eaScores = { items: {} };
  const profile = new URLSearchParams(location.search).get('profile');
  if (profile) {
    try {
      eaScores = await (await fetch('test-profiles/' + encodeURIComponent(profile) + '.json')).json();
    } catch (e) {
      console.warn('ceremony: could not load profile "' + profile + '" — using empty scores', e);
    }
  }
  const script = MHSCeremonyResolver.resolve(window.CEREMONY_DEFINITION, eaScores);
  window.__script = script;              // exposed for the test harness / debugging
  MHSCeremonyPlayer.start(script);
})();
</script>
</body>
</html>
